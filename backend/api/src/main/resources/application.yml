spring:
  application:
    name: bidstream
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bidstream}
    username: ${SPRING_DATASOURCE_USERNAME:bidstream}
    password: ${SPRING_DATASOURCE_PASSWORD:bidstream}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:bidstream}
    password: ${SPRING_RABBITMQ_PASSWORD:bidstream}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1000
          multiplier: 5
          max-interval: 25000
        default-requeue-rejected: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,demoSeed
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,rabbit,minio,outbox
  metrics:
    tags:
      application: bidstream
  prometheus:
    metrics:
      export:
        enabled: true

bidstream:
  version: 0.1.0
  auth:
    jwt-secret: ${JWT_SECRET:01234567890123456789012345678901}
    access-token-ttl-seconds: 900
    refresh-token-ttl-days: 7
  lots:
    require-images-for-schedule: true
  realtime:
    presence-ttl-seconds: 30
  scheduler:
    enabled: true
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:bidstream}
      secret-key: ${MINIO_SECRET_KEY:bidstream123}
      bucket: ${MINIO_BUCKET:bidstream}
      presign-expiry-seconds: 300

logging:
  pattern:
    level: "%5p [traceId=%X{traceId}]"
